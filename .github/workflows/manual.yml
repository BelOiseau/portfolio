name: Update content
on:
  workflow_dispatch:
    inputs:
      commitName:
        description: 'Name of the commit'
        required: true
        type: string
        default: 'update notion pages'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: ./build.sh
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_VERSION: ${{ secrets.NOTION_VERSION }}

      - name: Commit des fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "$COMMIT_NAME"
          git push
        env:
          COMMIT_NAME: ${{ inputs.commitName }}
